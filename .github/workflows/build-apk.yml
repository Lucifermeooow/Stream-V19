name: Build Stream V19 APK

on:
  workflow_dispatch:

  push:
    branches:
      - main

jobs:
  build:
    name: Build Stream V19 Release APK
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: |
          yes | sdkmanager --licenses > /dev/null || true

      - name: Verify project
        run: |
          echo "Project:"
          pwd

          echo ""
          echo "Root:"
          ls -la

          echo ""
          echo "Android:"
          ls -la android

          echo ""
          echo "Required files:"

          test -f pubspec.yaml
          test -d lib
          test -d android

          echo "pubspec.yaml: OK"
          echo "lib/: OK"
          echo "android/: OK"

      - name: Create Flutter local.properties
        run: |
          echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties
          echo "sdk.dir=$ANDROID_HOME" >> android/local.properties

          echo "Created android/local.properties:"
          cat android/local.properties

      - name: Create Gradle Wrapper
        run: |
          mkdir -p android/gradle/wrapper

          cat > android/gradle/wrapper/gradle-wrapper.properties <<'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.14-bin.zip
          networkTimeout=10000
          validateDistributionUrl=true
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF

          echo "Gradle wrapper configuration:"
          cat android/gradle/wrapper/gradle-wrapper.properties

      - name: Create Gradle Wrapper Script
        run: |
          cat > android/gradlew <<'EOF'
          #!/bin/sh

          APP_HOME=$(CDPATH= cd -- "$(dirname -- "$0")" && pwd)

          GRADLE_USER_HOME="${GRADLE_USER_HOME:-$HOME/.gradle}"

          DIST_URL="https://services.gradle.org/distributions/gradle-8.14-bin.zip"

          DIST_DIR="$GRADLE_USER_HOME/wrapper/dists/gradle-8.14-bin"

          mkdir -p "$DIST_DIR"

          ZIP_FILE="$DIST_DIR/gradle-8.14-bin.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "Downloading Gradle 8.14..."
            curl -L \
              --fail \
              --retry 3 \
              "$DIST_URL" \
              -o "$ZIP_FILE"
          fi

          INSTALL_DIR="$DIST_DIR/gradle-8.14"

          if [ ! -x "$INSTALL_DIR/bin/gradle" ]; then
            rm -rf "$INSTALL_DIR"

            mkdir -p "$INSTALL_DIR"

            unzip -q "$ZIP_FILE" \
              -d "$DIST_DIR"

            if [ -d "$DIST_DIR/gradle-8.14" ]; then
              :
            else
              FOUND=$(find "$DIST_DIR" -maxdepth 1 -type d -name "gradle-8.14*" | head -1)

              if [ -n "$FOUND" ]; then
                mv "$FOUND" "$INSTALL_DIR"
              fi
            fi
          fi

          exec "$INSTALL_DIR/bin/gradle" "$@"
          EOF

          chmod +x android/gradlew

      - name: Check Gradle
        run: |
          android/gradlew --version

      - name: Flutter Doctor
        run: |
          flutter --version
          dart --version
          flutter doctor -v

      - name: Flutter Clean
        run: |
          flutter clean

      - name: Flutter Pub Get
        run: |
          flutter pub get

      - name: Flutter Analyze
        run: |
          flutter analyze

      - name: Build Stream V19 APK
        run: |
          flutter build apk --release

      - name: Verify APK
        run: |
          test -f build/app/outputs/flutter-apk/app-release.apk

          echo "APK successfully created:"
          ls -lh build/app/outputs/flutter-apk/app-release.apk

      - name: Prepare APK
        run: |
          mkdir -p release

          cp \
            build/app/outputs/flutter-apk/app-release.apk \
            release/Stream-V19-release.apk

          ls -lh release/Stream-V19-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Stream-V19-APK
          path: release/Stream-V19-release.apk
          if-no-files-found: error
          retention-days: 30

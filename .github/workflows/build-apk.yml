name: Build Stream V19 APK

on:
  workflow_dispatch:

  push:
    branches:
      - main

concurrency:
  group: stream-v19-build
  cancel-in-progress: true

jobs:
  build:
    name: Build Stream V19 Release APK
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true

      - name: Setup Android
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: |
          yes | sdkmanager --licenses > /dev/null || true

      - name: Create local.properties
        run: |
          echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties
          echo "sdk.dir=$ANDROID_HOME" >> android/local.properties

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Flutter Clean
        run: |
          flutter clean

      - name: Flutter Pub Get
        run: |
          flutter pub get

      - name: Precache Flutter Android
        run: |
          flutter precache --android

      - name: Patch rtmp_streaming
        run: |
          PLUGIN="$HOME/.pub-cache/hosted/pub.dev/rtmp_streaming-2.0.1/android/build.gradle"

          test -f "$PLUGIN"

          python3 - "$PLUGIN" <<'PY'
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          text = path.read_text()

          old = '''kotlinOptions {
              jvmTarget  = "17"
          }'''

          new = '''kotlin {
              compilerOptions {
                  jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
              }
          }'''

          if old in text:
              text = text.replace(old, new)

          if "https://jitpack.io" not in text:
              text += '''

repositories {
    google()
    mavenCentral()
    maven {
        url 'https://jitpack.io'
    }
}
'''

          path.write_text(text)

          print("rtmp_streaming patched successfully.")
          PY

      - name: Flutter Analyze
        run: |
          flutter analyze

      - name: Build APK
        run: |
          flutter build apk --release

      - name: Verify APK
        run: |
          test -f build/app/outputs/flutter-apk/app-release.apk

          echo "APK CREATED:"
          ls -lh build/app/outputs/flutter-apk/app-release.apk

      - name: Prepare APK
        run: |
          mkdir -p release

          cp \
            build/app/outputs/flutter-apk/app-release.apk \
            release/Stream-V19-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Stream-V19-APK
          path: release/Stream-V19-release.apk
          if-no-files-found: error
          retention-days: 30

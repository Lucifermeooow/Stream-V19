name: Build Stream V19 APK

on:
  workflow_dispatch:

  push:
    branches:
      - main

jobs:
  build:
    name: Build Stream V19 Release APK
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: |
          yes | sdkmanager --licenses > /dev/null || true

      - name: Create local.properties
        run: |
          echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties
          echo "sdk.dir=$ANDROID_HOME" >> android/local.properties

      - name: Prepare Gradle
        run: |
          mkdir -p "$HOME/gradle-9.3.1"

          curl -L \
            --fail \
            --retry 3 \
            https://services.gradle.org/distributions/gradle-9.3.1-bin.zip \
            -o "$HOME/gradle-9.3.1.zip"

          unzip -q \
            "$HOME/gradle-9.3.1.zip" \
            -d "$HOME/gradle-9.3.1"

          echo "$HOME/gradle-9.3.1/gradle-9.3.1/bin" >> "$GITHUB_PATH"

          gradle --version

      - name: Verify Project
        run: |
          echo "========================================"
          echo "PROJECT"
          echo "========================================"

          pwd

          echo ""
          echo "Root:"
          ls -la

          echo ""
          echo "Android:"
          ls -la android

          echo ""
          echo "Gradle:"
          ls -la android/gradle/wrapper

          test -f pubspec.yaml
          test -d lib
          test -d android
          test -f android/gradle/wrapper/gradle-wrapper.properties

          echo ""
          echo "Project structure OK"

      - name: Configure Gradle Wrapper
        run: |
          cat > android/gradle/wrapper/gradle-wrapper.properties <<'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-9.3.1-bin.zip
          networkTimeout=10000
          validateDistributionUrl=true
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF

          cat android/gradle/wrapper/gradle-wrapper.properties

      - name: Flutter Doctor
        run: |
          flutter --version
          dart --version
          flutter doctor -v

      - name: Flutter Clean
        run: |
          flutter clean

      - name: Flutter Pub Get
        run: |
          flutter pub get

      - name: Flutter Analyze
        run: |
          flutter analyze

      - name: Build Stream V19 APK
        run: |
          flutter build apk --release

      - name: Verify APK
        run: |
          test -f build/app/outputs/flutter-apk/app-release.apk

          echo "========================================"
          echo "APK CREATED"
          echo "========================================"

          ls -lh build/app/outputs/flutter-apk/app-release.apk

      - name: Prepare APK
        run: |
          mkdir -p release

          cp \
            build/app/outputs/flutter-apk/app-release.apk \
            release/Stream-V19-release.apk

      - name: Upload Stream V19 APK
        uses: actions/upload-artifact@v4
        with:
          name: Stream-V19-APK
          path: release/Stream-V19-release.apk
          if-no-files-found: error
          retention-days: 30

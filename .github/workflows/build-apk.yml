name: Build Stream V19 APK

on:
  workflow_dispatch:

  push:
    branches:
      - main

jobs:
  build:
    name: Build Stream V19 Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: |
          yes | sdkmanager --licenses > /dev/null || true

      - name: Check Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          echo "Installed Android platforms:"
          ls -la "$ANDROID_HOME/platforms" || true

          echo "Installed Build Tools:"
          ls -la "$ANDROID_HOME/build-tools" || true

      - name: Verify Flutter project
        run: |
          test -f pubspec.yaml
          test -d lib
          test -d android
          test -f android/gradle/wrapper/gradle-wrapper.properties

          echo "Flutter project detected successfully."

      - name: Check Gradle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --version

      - name: Flutter Doctor
        run: |
          flutter --version
          dart --version
          flutter doctor -v

      - name: Flutter Clean
        run: |
          flutter clean

      - name: Flutter Pub Get
        run: |
          flutter pub get

      - name: Flutter Analyze
        run: |
          flutter analyze

      - name: Build Stream V19 APK
        run: |
          flutter build apk --release

      - name: Verify APK
        run: |
          test -f build/app/outputs/flutter-apk/app-release.apk

          echo "APK successfully created:"
          ls -lh build/app/outputs/flutter-apk/app-release.apk

      - name: Prepare APK
        run: |
          mkdir -p release

          cp \
            build/app/outputs/flutter-apk/app-release.apk \
            release/Stream-V19-release.apk

          ls -lh release/Stream-V19-release.apk

      - name: Upload Stream V19 APK
        uses: actions/upload-artifact@v4
        with:
          name: Stream-V19-APK
          path: release/Stream-V19-release.apk
          if-no-files-found: error
          retention-days: 30

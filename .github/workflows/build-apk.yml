name: Build Stream V19 APK

on:
  workflow_dispatch:

  push:
    branches:
      - main

jobs:
  build:
    name: Build Stream V19 Release APK
    runs-on: ubuntu-latest

    steps:

      # =========================================
      # 1. Checkout
      # =========================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # =========================================
      # 2. Java 17
      # =========================================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle


      # =========================================
      # 3. Flutter 3.47.2
      # =========================================
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true


      # =========================================
      # 4. Android SDK
      # =========================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3


      # =========================================
      # 5. Accept Android licenses
      # =========================================
      - name: Accept Android licenses
        run: |
          yes | sdkmanager --licenses > /dev/null || true


      # =========================================
      # 6. Create local.properties
      # =========================================
      - name: Create Android local.properties
        run: |
          echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties
          echo "sdk.dir=$ANDROID_HOME" >> android/local.properties

          echo "android/local.properties:"
          cat android/local.properties


      # =========================================
      # 7. Verify project
      # =========================================
      - name: Verify Flutter project
        run: |
          echo "========================================"
          echo "PROJECT"
          echo "========================================"

          pwd

          echo ""
          echo "Root:"
          ls -la

          echo ""
          echo "Android:"
          ls -la android

          echo ""
          echo "Gradle:"
          ls -la android/gradle || true

          echo ""
          echo "Gradle Wrapper:"
          ls -la android/gradle/wrapper || true

          echo ""
          echo "Required files:"

          test -f pubspec.yaml
          test -d lib
          test -d android
          test -f android/gradlew
          test -f android/gradle/wrapper/gradle-wrapper.properties

          echo ""
          echo "All required files exist."


      # =========================================
      # 8. Make Gradle executable
      # =========================================
      - name: Prepare Gradle Wrapper
        run: |
          chmod +x android/gradlew

          echo "Gradle wrapper:"
          ls -lh android/gradlew

          echo ""
          echo "Gradle configuration:"
          cat android/gradle/wrapper/gradle-wrapper.properties


      # =========================================
      # 9. Check Gradle
      # =========================================
      - name: Check Gradle Version
        run: |
          android/gradlew --version


      # =========================================
      # 10. Flutter Doctor
      # =========================================
      - name: Flutter Doctor
        run: |
          flutter --version
          dart --version
          flutter doctor -v


      # =========================================
      # 11. Clean
      # =========================================
      - name: Flutter Clean
        run: |
          flutter clean


      # =========================================
      # 12. Pub Get
      # =========================================
      - name: Flutter Pub Get
        run: |
          flutter pub get


      # =========================================
      # 13. Analyze
      # =========================================
      - name: Flutter Analyze
        run: |
          flutter analyze


      # =========================================
      # 14. Build APK
      # =========================================
      - name: Build Stream V19 APK
        run: |
          flutter build apk --release


      # =========================================
      # 15. Verify APK
      # =========================================
      - name: Verify APK
        run: |
          echo "========================================"
          echo "APK"
          echo "========================================"

          test -f build/app/outputs/flutter-apk/app-release.apk

          ls -lh build/app/outputs/flutter-apk/app-release.apk

          echo ""
          echo "Stream V19 APK created successfully."


      # =========================================
      # 16. Prepare APK
      # =========================================
      - name: Prepare Stream V19 APK
        run: |
          mkdir -p release

          cp \
            build/app/outputs/flutter-apk/app-release.apk \
            release/Stream-V19-release.apk

          echo ""
          echo "Final APK:"
          ls -lh release/Stream-V19-release.apk


      # =========================================
      # 17. Upload APK
      # =========================================
      - name: Upload Stream V19 APK
        uses: actions/upload-artifact@v4
        with:
          name: Stream-V19-APK
          path: release/Stream-V19-release.apk
          if-no-files-found: error
          retention-days: 30

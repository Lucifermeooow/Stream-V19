name: Build Stream V19 APK

on:
  workflow_dispatch:

  push:
    branches:
      - main

concurrency:
  group: stream-v19-build
  cancel-in-progress: true

jobs:
  build:
    name: Build Stream V19 Release APK
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: |
          yes | sdkmanager --licenses > /dev/null || true

      - name: Create local.properties
        run: |
          echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties
          echo "sdk.dir=$ANDROID_HOME" >> android/local.properties

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Verify project
        run: |
          test -f pubspec.yaml
          test -d lib
          test -d android
          test -f android/gradle/wrapper/gradle-wrapper.properties

          echo "Project structure OK"

      - name: Flutter Doctor
        run: |
          flutter --version
          dart --version
          flutter doctor -v

      - name: Flutter Clean
        run: |
          flutter clean

      - name: Flutter Pub Get
        run: |
          flutter pub get

      # ==================================================
      # PATCH rtmp_streaming 2.0.1 FOR AGP 9
      # ==================================================
      - name: Patch rtmp_streaming 2.0.1
        run: |
          PLUGIN="$HOME/.pub-cache/hosted/pub.dev/rtmp_streaming-2.0.1/android/build.gradle"

          echo "Checking:"
          echo "$PLUGIN"

          test -f "$PLUGIN"

          echo ""
          echo "Original rtmp_streaming build.gradle:"
          nl -ba "$PLUGIN" | sed -n '25,45p'

          python3 - <<'PY'
          from pathlib import Path

          path = Path.home() / ".pub-cache/hosted/pub.dev/rtmp_streaming-2.0.1/android/build.gradle"

          text = path.read_text()

          old = '''kotlinOptions {
              jvmTarget = "17"
          }'''

          new = '''kotlin {
              compilerOptions {
                  jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
              }
          }'''

          if old not in text:
              print("Expected kotlinOptions block was not found.")
              print("Current block around kotlinOptions:")

              lines = text.splitlines()

              for i, line in enumerate(lines):
                  if "kotlinOptions" in line:
                      start = max(0, i - 5)
                      end = min(len(lines), i + 8)

                      for n in range(start, end):
                          print(f"{n + 1}: {lines[n]}")

              raise SystemExit(1)

          text = text.replace(old, new)

          path.write_text(text)

          print("Patch applied successfully.")
          PY

          echo ""
          echo "Patched rtmp_streaming build.gradle:"
          nl -ba "$PLUGIN" | sed -n '25,50p'

      - name: Flutter Analyze
        run: |
          flutter analyze

      - name: Build Stream V19 APK
        run: |
          flutter build apk --release

      - name: Verify APK
        run: |
          test -f build/app/outputs/flutter-apk/app-release.apk

          echo "========================================"
          echo "STREAM V19 APK CREATED"
          echo "========================================"

          ls -lh build/app/outputs/flutter-apk/app-release.apk

      - name: Prepare APK
        run: |
          mkdir -p release

          cp \
            build/app/outputs/flutter-apk/app-release.apk \
            release/Stream-V19-release.apk

      - name: Upload Stream V19 APK
        uses: actions/upload-artifact@v4
        with:
          name: Stream-V19-APK
          path: release/Stream-V19-release.apk
          if-no-files-found: error
          retention-days: 30

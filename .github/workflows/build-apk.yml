name: Build Stream V19 APK

on:
  workflow_dispatch:

  push:
    branches:
      - main

jobs:
  build:
    name: Build Stream V19 Release APK
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. Checkout
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # ==========================================
      # 2. Java 17
      # ==========================================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle


      # ==========================================
      # 3. Flutter
      # ==========================================
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true


      # ==========================================
      # 4. Android SDK
      # ==========================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3


      # ==========================================
      # 5. Accept licenses
      # ==========================================
      - name: Accept Android licenses
        run: |
          yes | sdkmanager --licenses > /dev/null || true


      # ==========================================
      # 6. Check Android SDK
      # ==========================================
      - name: Check Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          echo ""
          echo "Installed Android platforms:"
          ls -la "$ANDROID_HOME/platforms" || true

          echo ""
          echo "Installed Build Tools:"
          ls -la "$ANDROID_HOME/build-tools" || true


      # ==========================================
      # 7. Verify project
      # ==========================================
      - name: Verify Flutter project
        run: |
          echo "Current directory:"
          pwd

          echo ""
          echo "Root files:"
          ls -la

          echo ""
          echo "Checking required files..."

          test -f pubspec.yaml
          test -d lib
          test -d android
          test -f android/gradlew
          test -f android/gradle/wrapper/gradle-wrapper.properties

          echo ""
          echo "Flutter project structure OK"


      # ==========================================
      # 8. Check Gradle Wrapper
      # ==========================================
      - name: Check Gradle Wrapper
        run: |
          chmod +x android/gradlew

          echo "Gradle version:"
          android/gradlew --version


      # ==========================================
      # 9. Flutter Doctor
      # ==========================================
      - name: Flutter Doctor
        run: |
          flutter --version
          dart --version
          flutter doctor -v


      # ==========================================
      # 10. Flutter Clean
      # ==========================================
      - name: Flutter Clean
        run: |
          flutter clean


      # ==========================================
      # 11. Get dependencies
      # ==========================================
      - name: Flutter Pub Get
        run: |
          flutter pub get


      # ==========================================
      # 12. Analyze
      # ==========================================
      - name: Flutter Analyze
        run: |
          flutter analyze


      # ==========================================
      # 13. Build APK
      # ==========================================
      - name: Build Stream V19 APK
        run: |
          flutter build apk --release


      # ==========================================
      # 14. Verify APK
      # ==========================================
      - name: Verify APK
        run: |
          echo "Checking generated APK..."

          test -f build/app/outputs/flutter-apk/app-release.apk

          echo ""
          echo "APK CREATED SUCCESSFULLY:"
          ls -lh build/app/outputs/flutter-apk/app-release.apk


      # ==========================================
      # 15. Rename APK
      # ==========================================
      - name: Prepare Stream V19 APK
        run: |
          mkdir -p release

          cp \
            build/app/outputs/flutter-apk/app-release.apk \
            release/Stream-V19-release.apk

          echo ""
          echo "Final APK:"
          ls -lh release/Stream-V19-release.apk


      # ==========================================
      # 16. Upload APK
      # ==========================================
      - name: Upload Stream V19 APK
        uses: actions/upload-artifact@v4
        with:
          name: Stream-V19-APK
          path: release/Stream-V19-release.apk
          if-no-files-found: error
          retention-days: 30

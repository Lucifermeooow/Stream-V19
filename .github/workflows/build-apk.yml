name: Build Stream V19 APK

on:
  workflow_dispatch:

  push:
    branches:
      - main

concurrency:
  group: stream-v19-build
  cancel-in-progress: true

jobs:
  build:
    name: Build Stream V19 Release APK
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: |
          yes | sdkmanager --licenses > /dev/null || true

      - name: Create local.properties
        run: |
          echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties
          echo "sdk.dir=$ANDROID_HOME" >> android/local.properties

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Verify Project
        run: |
          echo "========================================"
          echo "PROJECT"
          echo "========================================"

          pwd
          ls -la

          echo ""
          echo "Android:"
          ls -la android

          echo ""
          echo "Gradle:"
          ls -la android/gradle/wrapper

          test -f pubspec.yaml
          test -d lib
          test -d android
          test -f android/gradle/wrapper/gradle-wrapper.properties

          echo ""
          echo "Project structure OK."

      - name: Check Gradle Version
        run: |
          gradle --version

      - name: Flutter Doctor
        run: |
          flutter --version
          dart --version
          flutter doctor -v

      - name: Flutter Clean
        run: |
          flutter clean

      - name: Flutter Pub Get
        run: |
          flutter pub get

      # ==========================================
      # PATCH RTMP STREAMING
      # ==========================================
      - name: Patch rtmp_streaming 2.0.1
        run: |
          PLUGIN="$HOME/.pub-cache/hosted/pub.dev/rtmp_streaming-2.0.1/android/build.gradle"

          echo "========================================"
          echo "RTMP STREAMING PATCH"
          echo "========================================"

          test -f "$PLUGIN"

          echo ""
          echo "Before patch:"
          nl -ba "$PLUGIN" | sed -n '25,45p'

          python3 - "$PLUGIN" <<'PY'
          import re
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          text = path.read_text()

          pattern = r'''(?ms)^[ \t]*kotlinOptions[ \t]*\{.*?^[ \t]*\}'''

          replacement = '''    kotlin {
              compilerOptions {
                  jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
              }
          }'''

          new_text, count = re.subn(
              pattern,
              replacement,
              text,
              count=1
          )

          if count != 1:
              print("ERROR: kotlinOptions block was not found.")
              print("")
              print("Current kotlinOptions occurrences:")

              for match in re.finditer(r'kotlinOptions', text):
                  start = max(0, match.start() - 100)
                  end = min(len(text), match.end() + 200)
                  print(text[start:end])

              sys.exit(1)

          path.write_text(new_text)

          print("SUCCESS: kotlinOptions was replaced.")
          PY

          echo ""
          echo "After patch:"
          nl -ba "$PLUGIN" | sed -n '25,50p'

          echo ""
          echo "========================================"
          echo "PATCH COMPLETE"
          echo "========================================"

      - name: Flutter Analyze
        run: |
          flutter analyze

      - name: Build Stream V19 APK
        run: |
          flutter build apk --release

      - name: Verify APK
        run: |
          echo "========================================"
          echo "APK VERIFICATION"
          echo "========================================"

          test -f build/app/outputs/flutter-apk/app-release.apk

          ls -lh build/app/outputs/flutter-apk/app-release.apk

          echo ""
          echo "STREAM V19 APK CREATED SUCCESSFULLY"

      - name: Prepare APK
        run: |
          mkdir -p release

          cp \
            build/app/outputs/flutter-apk/app-release.apk \
            release/Stream-V19-release.apk

          ls -lh release/Stream-V19-release.apk

      - name: Upload Stream V19 APK
        uses: actions/upload-artifact@v4
        with:
          name: Stream-V19-APK
          path: release/Stream-V19-release.apk
          if-no-files-found: error
          retention-days: 30

name: Build Stream V19 APK

on:
  workflow_dispatch:

  push:
    branches:
      - main

jobs:
  build:
    name: Build Stream V19 Release APK
    runs-on: ubuntu-latest

    steps:

      # =========================================
      # 1. Checkout
      # =========================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # =========================================
      # 2. Java 17
      # =========================================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle


      # =========================================
      # 3. Flutter
      # =========================================
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true


      # =========================================
      # 4. Android SDK
      # =========================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3


      # =========================================
      # 5. Android Licenses
      # =========================================
      - name: Accept Android licenses
        run: |
          yes | sdkmanager --licenses > /dev/null || true


      # =========================================
      # 6. Check Android SDK
      # =========================================
      - name: Check Android SDK
        run: |
          echo "========================================"
          echo "ANDROID SDK"
          echo "========================================"

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          echo ""
          echo "Installed platforms:"
          ls -la "$ANDROID_HOME/platforms" || true

          echo ""
          echo "Installed build tools:"
          ls -la "$ANDROID_HOME/build-tools" || true

          echo ""
          echo "========================================"


      # =========================================
      # 7. Verify Project Structure
      # =========================================
      - name: Verify Flutter project
        run: |
          echo "========================================"
          echo "PROJECT STRUCTURE"
          echo "========================================"

          echo ""
          echo "Current directory:"
          pwd

          echo ""
          echo "Root files:"
          ls -la

          echo ""
          echo "Android directory:"
          ls -la android || true

          echo ""
          echo "Android Gradle directory:"
          ls -la android/gradle || true

          echo ""
          echo "Gradle wrapper directory:"
          ls -la android/gradle/wrapper || true

          echo ""
          echo "========================================"
          echo "REQUIRED FILES"
          echo "========================================"

          echo ""

          if [ -f pubspec.yaml ]; then
            echo "OK: pubspec.yaml"
          else
            echo "ERROR: pubspec.yaml is missing"
            exit 1
          fi

          if [ -d lib ]; then
            echo "OK: lib/"
          else
            echo "ERROR: lib/ is missing"
            exit 1
          fi

          if [ -d android ]; then
            echo "OK: android/"
          else
            echo "ERROR: android/ is missing"
            exit 1
          fi

          if [ -f android/gradlew ]; then
            echo "OK: android/gradlew"
          else
            echo "WARNING: android/gradlew is missing"
          fi

          if [ -f android/gradle/wrapper/gradle-wrapper.properties ]; then
            echo "OK: gradle-wrapper.properties"
          else
            echo "WARNING: gradle-wrapper.properties is missing"
          fi

          echo ""
          echo "========================================"
          echo "VERIFY COMPLETE"
          echo "========================================"


      # =========================================
      # 8. Generate Gradle Wrapper if missing
      # =========================================
      - name: Prepare Gradle Wrapper
        run: |
          if [ ! -f android/gradlew ]; then
            echo "Gradle wrapper is missing."
            echo "Generating Gradle wrapper..."

            cd android

            gradle wrapper \
              --gradle-version 8.14

            cd ..

            echo "Gradle wrapper generated."
          else
            echo "Gradle wrapper already exists."
          fi

          chmod +x android/gradlew

          echo ""
          echo "Gradle wrapper:"
          ls -lh android/gradlew


      # =========================================
      # 9. Check Gradle Version
      # =========================================
      - name: Check Gradle Version
        run: |
          chmod +x android/gradlew

          echo "========================================"
          echo "GRADLE VERSION"
          echo "========================================"

          android/gradlew --version

          echo "========================================"


      # =========================================
      # 10. Flutter Doctor
      # =========================================
      - name: Flutter Doctor
        run: |
          flutter --version
          dart --version
          flutter doctor -v


      # =========================================
      # 11. Flutter Clean
      # =========================================
      - name: Flutter Clean
        run: |
          flutter clean


      # =========================================
      # 12. Get Dependencies
      # =========================================
      - name: Flutter Pub Get
        run: |
          flutter pub get


      # =========================================
      # 13. Analyze
      # =========================================
      - name: Flutter Analyze
        run: |
          flutter analyze


      # =========================================
      # 14. Build APK
      # =========================================
      - name: Build Stream V19 APK
        run: |
          flutter build apk --release


      # =========================================
      # 15. Verify APK
      # =========================================
      - name: Verify APK
        run: |
          echo "========================================"
          echo "APK VERIFICATION"
          echo "========================================"

          test -f build/app/outputs/flutter-apk/app-release.apk

          ls -lh \
            build/app/outputs/flutter-apk/app-release.apk

          echo ""
          echo "APK CREATED SUCCESSFULLY"


      # =========================================
      # 16. Prepare APK
      # =========================================
      - name: Prepare Stream V19 APK
        run: |
          mkdir -p release

          cp \
            build/app/outputs/flutter-apk/app-release.apk \
            release/Stream-V19-release.apk

          echo ""
          echo "Final APK:"
          ls -lh release/Stream-V19-release.apk


      # =========================================
      # 17. Upload APK
      # =========================================
      - name: Upload Stream V19 APK
        uses: actions/upload-artifact@v4
        with:
          name: Stream-V19-APK
          path: release/Stream-V19-release.apk
          if-no-files-found: error
          retention-days: 30
